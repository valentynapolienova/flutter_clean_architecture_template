include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - lib/l10n/generated/**
    - android/**
    - ios/**

linter:
  rules:
    # `dart format` wraps code; long string literals and URLs may stay long.
    lines_longer_than_80_chars: false
    # Document intent where it isn't obvious, not every public member.
    public_member_api_docs: false
    # pubspec.yaml groups dependencies by purpose.
    sort_pub_dependencies: false

formatter:
  page_width: 80

# Read by `bloc lint .` (dart pub global activate bloc_tools).
bloc:
  rules:
    avoid_public_fields: true

name: clean_architecture_template
description: Feature-first clean architecture template for Flutter apps.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^18.0.1

  # Data
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5

  # Localization
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
